version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Audio and ML stack: versions are pinned on purpose (see AGENTS.md / HANDOFF.md gotchas).
      # A second TensorFlow.js copy breaks Basic Pitch (G3); the rest carry wasm/worklet assets
      # that are copied by hand in scripts/copy-assets.mjs.
      - dependency-name: "@tensorflow/tfjs"
      - dependency-name: "@spotify/basic-pitch"
      - dependency-name: "signalsmith-stretch"
      - dependency-name: "onnxruntime-web"
      - dependency-name: "demucs-web"
      - dependency-name: "@coderline/alphatab"
      # Next major upgrades are done by hand.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
