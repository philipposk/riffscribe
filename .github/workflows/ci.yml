# On every pull request and every push to main, GitHub runs the checks below on a clean machine:
# types, lint, the verify scripts and the cello eval, a full build, and a scan for leaked keys.
# main deploys to production on push, so only merge a pull request when this is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, so the secret scan can read every commit in the pull request
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Every check reports on its own, so one failure never hides another.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      # The verify scripts, then the cello eval. Its slow stages need real recordings
      # (RIFFSCRIBE_EVAL_DATA), which CI does not have, so they skip.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      # Placeholder Supabase values: the build must work without any real keys.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      # Looks for API keys in files git tracks. Prints file:line, never the key.
      - name: Secret scan
        if: ${{ !cancelled() }}
        run: node scripts/secret-scan.mjs
      # The same scan over every commit in this pull request, so a key that one commit
      # added and a later commit deleted is still caught. The branch name goes through
      # an env var, not the shell line.
      - name: Secret scan (every commit in this pull request)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/secret-scan.mjs --range "origin/${BASE_REF}..HEAD"
